name: extract-of

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download OF zip (HPC release asset)
        run: |
          set -e
          curl -fSL --retry 3 -o of.zip \
            "https://github.com/javadxpro/HPC/releases/download/7/OrangeFox-R12.0-vayu.zip"
          stat -c 'of.zip %s bytes' of.zip
          sha256sum of.zip

      - name: Unzip
        run: |
          set -e
          unzip -o of.zip -d ofzip > /dev/null
          find ofzip -type f | sort | sed 's/^/ZIPFILE: /'

      - name: Analyze recovery image
        run: |
          set -e
          IMG=$(find ofzip -type f -iname '*.img' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2-)
          echo "IMG=$IMG ($(stat -c%s "$IMG") bytes)"
          python3 tools/of_extract/analyze.py "$IMG" out ofzip

      - name: Commit results to of-extract-results
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp out/* results/
          IMG=$(find ofzip -type f -iname '*.img' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2-)
          # raw img is 134MB (over GitHub's 100MB file limit) - commit compressed only
          zip -9 results/of-recovery.zip < "$IMG" 2>/dev/null || { cp "$IMG" results/of-recovery.img.tmp && zip -9 results/of-recovery.zip of-recovery.img.tmp && rm of-recovery.img.tmp; }
          ls -la results/
          git checkout -B of-extract-results
          git add results
          git commit -m "OF R12.0 vayu: extracted parts + analysis (auto)" || echo "nothing new"
          git push -f origin of-extract-results
          git checkout - || git checkout -

      - name: Post analysis to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ISSUE=$(gh issue list -R javadxpro/HPC --state open --search "in:title OF R12.0 vayu extraction" --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh issue create -R javadxpro/HPC --title "OF R12.0 vayu extraction" --body "Auto analysis of OrangeFox R12.0 recovery image for vayu. Results on branch of-extract-results." --json number --jq .number)
          fi
          {
            echo "## Auto analysis $(date -u +%FT%TZ)"
            echo
            echo "Best layout and full report:"
            echo
            echo '```'
            head -c 50000 out/analysis.md
            echo
            echo '```'
            echo
            echo "Parts on branch \`of-extract-results\` under \`results/\`."
          } > comment.md
          gh issue comment -R javadxpro/HPC "$ISSUE" --body-file comment.md
