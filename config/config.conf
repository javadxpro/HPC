# ======================================================================
#  Hamedis Performance Core (HPC) - main configuration
#  Live file: /data/adb/hamedis/config.conf
#
#  Edit, then apply without rebooting:
#      su -c 'sh /data/adb/modules/hamedis_performance_core/action.sh reload'
# ======================================================================

# ---------------------------------------------------------------- mode
# Baseline profile: overclock | gaming120 | gaming90 | performance
#                   | balanced | battery_saver | longevity
MODE=balanced

# ---------------------------------------------------------- game mode
# 1 = automatically switch profiles when a listed game runs
AUTO_GAME_MODE=0

# Profile to use while a game is running.
#   performance - safe default, eases off from 50C
#   gaming120   - for 90/120 Hz gaming on a device with thermal headroom.
#                 Stays out of the way until 68C. Use this if your phone
#                 runs cool and you were losing frames to HPC itself.
GAME_PROFILE=gaming90

# Packages treated as games. One per line or space separated.
# Find a package name with:  pm list packages | grep -i <name>
GAME_PACKAGES="
com.mojang.minecraftpe
com.mojang.minecraftpe.stdmusic4403
com.tencent.ig
com.pubg.krmobile
com.vng.pubgmobile
com.rekoo.pubgm
com.activision.callofduty.shooter
com.garena.game.codm
com.dts.freefireth
com.dts.freefiremax
com.miHoYo.GenshinImpact
com.miHoYo.Yuanshen
com.supercell.clashofclans
com.ea.gp.fifamobile
com.gameloft.android.ANMP.GloftA9HM
com.epicgames.fortnite
com.roblox.client
com.netease.newspike
com.YoStar.AetherGazer
com.riotgames.league.wildrift
"

# ------------------------------------------------------------- thermal
# 1 = HPC backs off early so the kernel throttles less abruptly.
# This NEVER disables kernel thermal protection - it only lowers the
# ceiling HPC itself requested. Setting 0 just makes HPC passive.
THERMAL_PROTECTION=1

# Per-profile thresholds live in the profile files. These are fallbacks.
# Hysteresis in degrees C. A state only de-escalates once the
# temperature falls this far BELOW the threshold it crossed. Prevents
# rapid flapping when the device sits right on a boundary.
THERMAL_HYST=4

TEMP_WARM=46
TEMP_HOT=53
TEMP_CRITICAL=60

# ------------------------------------------------------------- battery
# 1 = adjust profile based on charge level (low-battery protection)
BATTERY_AWARE=1

# Below this charge %, PERFORMANCE is downgraded to BALANCED (unplugged)
BATT_LOW=20

# Below this charge %, COOL is forced (unplugged)
BATT_CRITICAL=10

# ------------------------------------------------------------- logging
# 1 = INFO logging on. Errors and warnings are always recorded.
LOGGING=1

# Set to 1 only while troubleshooting - it is noisy.
HPC_DEBUG=0

# Log file size cap in bytes before rotation (default 256 KiB)
HPC_LOG_MAX_BYTES=262144

# ------------------------------------------------------------- service
# Seconds between service wakeups. Profiles may override this.
# Lower = faster thermal response, slightly more overhead.
# Do not go below 15; there is no benefit and it wastes power.
POLL_INTERVAL=45

# 1 = run the background service at all. 0 = apply profile at boot
# and then do nothing (zero ongoing overhead).
SERVICE_ENABLED=1

# ---------------------------------------------------------------- WebUI
# Port for the web management interface. Bound to 127.0.0.1 only, so it
# is never reachable from the network.
WEBUI_PORT=1111

# 1 = start the WebUI automatically at boot
WEBUI_AUTOSTART=1
