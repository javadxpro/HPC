# Hamedis Performance Core - BALANCED profile (default)
# Priority: sane everyday behaviour. Close to stock, with the rough
# edges smoothed out. This is what the device runs most of the time.

PROFILE_NAME="BALANCED"
PROFILE_DESC="Default. Good performance/temperature balance"

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="schedutil walt interactive ondemand"
CPU_MAX_PERCENT=100
CPU_MIN_PERCENT=0
CPU_UP_RATE_LIMIT_US=10000
CPU_DOWN_RATE_LIMIT_US=15000
CPU_HISPEED_LOAD=90

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="msm-adreno-tz simple_ondemand"
GPU_MAX_PERCENT=100
GPU_MIN_PERCENT=0
GPU_IDLE_TIMER=80
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
SCHED_MIN_GRANULARITY_NS=1500000
SCHED_WAKEUP_GRANULARITY_NS=2000000
SCHED_MIGRATION_COST_NS=500000
SCHED_LATENCY_NS=12000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=1

# --- VM / memory -----------------------------------------------------
VM_SWAPPINESS=100
VM_VFS_CACHE_PRESSURE=100
VM_DIRTY_RATIO=20
VM_DIRTY_BACKGROUND_RATIO=10
VM_DIRTY_EXPIRE_CENTISECS=2000
VM_DIRTY_WRITEBACK_CENTISECS=1000
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=5

# --- Graphics ---------------------------------------------------------
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=45
TEMP_WARM=46
TEMP_HOT=53
TEMP_CRITICAL=60
