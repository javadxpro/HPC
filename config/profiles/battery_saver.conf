# Hamedis Performance Core - BATTERY SAVER profile
# Priority: maximum battery life. Peak performance is deliberately
# sacrificed; use this when the phone needs to last, not to shine.

PROFILE_NAME="BATTERY SAVER"
PROFILE_DESC="Maximum battery life - low clocks, deep idle, slow wakeups"
PROFILE_VERSION=1

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="powersave conservative schedutil ondemand"
CPU_MAX_PERCENT=55
CPU_MIN_PERCENT=0
CPU_UP_RATE_LIMIT_US=30000
CPU_DOWN_RATE_LIMIT_US=20000
CPU_HISPEED_LOAD=97

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="powersave simple_ondemand msm-adreno-tz"
GPU_MAX_PERCENT=60
GPU_MIN_PERCENT=0
GPU_IDLE_TIMER=45
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
SCHED_MIN_GRANULARITY_NS=2500000
SCHED_WAKEUP_GRANULARITY_NS=4000000
SCHED_MIGRATION_COST_NS=750000
SCHED_LATENCY_NS=24000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=1

# --- VM / memory -----------------------------------------------------
VM_SWAPPINESS=150
VM_VFS_CACHE_PRESSURE=100
VM_DIRTY_RATIO=15
VM_DIRTY_BACKGROUND_RATIO=8
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=15

# --- Graphics ---------------------------------------------------------
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=90
TEMP_WARM=40
TEMP_HOT=46
TEMP_CRITICAL=52
