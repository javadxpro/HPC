# Hamedis Performance Core - GAMING120 profile
#
# For high-refresh gaming (90/120 Hz) on a device that has thermal
# headroom to spare.
#
# WHY THIS EXISTS:
# The stock PERFORMANCE profile starts easing off at 50C. On a
# Snapdragon 860 that is simply "warmed up" - a 120 fps session sits at
# 52-65C all day and the kernel itself does not begin throttling until
# roughly 75-85C. So on a well-cooled device, PERFORMANCE was the thing
# costing frames, not the heat.
#
# This profile moves HPC's thresholds up so it stays out of the way
# until the SoC is genuinely hot, and leaves the kernel as the real
# safety authority - exactly as before.
#
# SAFETY IS UNCHANGED:
#   - kernel thermal protection still fully enabled
#   - GPU throttling still forced on
#   - clocks still never pinned to max
#   - CRITICAL still well below the kernel's own throttle point
# If the device ever does get hot, this profile still backs off - it
# just stops panicking at temperatures that are perfectly normal.

PROFILE_NAME="GAMING120"
PROFILE_DESC="High-refresh gaming, for devices with thermal headroom"

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="schedutil walt interactive performance ondemand"
CPU_MAX_PERCENT=100

# Higher floor than PERFORMANCE (25%). At 120 fps the frame budget is
# 8.33 ms; letting clocks fall to the bottom step between frames is what
# produces the occasional 2-3 frame hitch. A firmer floor costs some
# idle power but removes that stutter.
CPU_MIN_PERCENT=35

# React to load almost immediately, decay slowly.
CPU_UP_RATE_LIMIT_US=250
CPU_DOWN_RATE_LIMIT_US=10000
CPU_HISPEED_LOAD=75

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="msm-adreno-tz performance simple_ondemand"
GPU_MAX_PERCENT=100
# Higher GPU floor for the same reason as the CPU floor.
GPU_MIN_PERCENT=40
# Keep the GPU awake between frames. At 120 fps frames arrive every
# 8.3 ms, so power-gating is pure overhead.
GPU_IDLE_TIMER=200
# NON-NEGOTIABLE: kernel GPU throttling stays on.
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
# Tightest latency of any profile: render and input threads must be
# picked up within the 8.33 ms budget.
SCHED_MIN_GRANULARITY_NS=500000
SCHED_WAKEUP_GRANULARITY_NS=750000
SCHED_MIGRATION_COST_NS=200000
SCHED_LATENCY_NS=4000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=0

# --- VM / memory -----------------------------------------------------
# Keep game assets resident. Not zero - an OOM kill mid-match is far
# worse than a little zRAM traffic.
VM_SWAPPINESS=40
VM_VFS_CACHE_PRESSURE=70
VM_DIRTY_RATIO=35
VM_DIRTY_BACKGROUND_RATIO=20
VM_DIRTY_EXPIRE_CENTISECS=1500
VM_DIRTY_WRITEBACK_CENTISECS=1000
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=20

# --- Graphics --------------------------------------------------------
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=30

# --- Thermal thresholds ----------------------------------------------
# THE KEY CHANGE. Old PERFORMANCE values were 50/58/64 - it started
# throttling while the chip was merely warm.
#
#   68C WARM     - genuinely warm, ease off 10%
#   76C HOT      - approaching the kernel's own throttle range
#   82C CRITICAL - back off hard, before the kernel has to slam it
#
# The kernel still governs above this. If your device does run hot,
# lower these back toward 60/68/74.
TEMP_WARM=68
TEMP_HOT=76
TEMP_CRITICAL=82
