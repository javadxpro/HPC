# Hamedis Performance Core - LONGEVITY profile
#
# FOR HARDWARE THAT IS ALREADY DAMAGED OR DEGRADING.
#
# Use this if any of the following are true:
#   - the CPU has been replaced (reballed or swapped) before
#   - the battery is swollen, or its measured capacity is well below design
#   - the phone gets uncomfortably hot in normal use
#   - you want to keep the device alive as long as possible
#
# This is the most conservative profile in the module. It deliberately
# gives up peak performance to reduce junction temperature and battery
# stress, because on failing hardware heat is the thing that finishes
# the job.
#
# WHY THESE NUMBERS:
# Silicon degradation (electromigration, solder-joint fatigue on a
# reballed CPU) accelerates roughly exponentially with temperature. The
# difference between sustaining 70C and sustaining 55C is not 20% more
# life, it is far more than that. A swollen battery additionally must
# not be pushed: heat accelerates gas generation inside the cell.

PROFILE_NAME="LONGEVITY"
PROFILE_DESC="Maximum hardware lifespan. For damaged or degrading devices"

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="conservative powersave schedutil ondemand"

# Hard ceiling at 60% of the frequency range. On an SD860 this keeps the
# big cores well out of the region where power draw rises fastest.
# Above roughly 70% of max frequency, power (and therefore heat) rises
# much faster than performance does - you pay a lot of watts for a
# little speed. This profile refuses that trade.
CPU_MAX_PERCENT=60
CPU_MIN_PERCENT=0

# Slow, lazy ramping. Do not chase transient load spikes.
CPU_UP_RATE_LIMIT_US=30000
CPU_DOWN_RATE_LIMIT_US=15000
CPU_HISPEED_LOAD=97

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="powersave simple_ondemand msm-adreno-tz"
GPU_MAX_PERCENT=60
GPU_MIN_PERCENT=0
# Power the GPU down aggressively between frames.
GPU_IDLE_TIMER=50
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
SCHED_MIN_GRANULARITY_NS=3000000
SCHED_WAKEUP_GRANULARITY_NS=4000000
SCHED_MIGRATION_COST_NS=1000000
SCHED_LATENCY_NS=20000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=1

# --- VM / memory -----------------------------------------------------
# Lean on zRAM rather than re-reading from flash: compression is cheaper
# in both power and heat than sustained storage I/O.
VM_SWAPPINESS=130
VM_VFS_CACHE_PRESSURE=120
VM_DIRTY_RATIO=15
VM_DIRTY_BACKGROUND_RATIO=8
VM_DIRTY_EXPIRE_CENTISECS=4000
VM_DIRTY_WRITEBACK_CENTISECS=2000
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=20

# --- Graphics --------------------------------------------------------
# Vulkan still helps here: less CPU work for the same frame means less
# heat, not just more speed.
GFX_RENDERER=auto

# --- Kernel / I-O ----------------------------------------------------
# Fewer queued requests and modest read-ahead reduce storage controller
# activity, which is a real if small heat source.
# Preference list, first match wins. Older kernels expose
# noop/deadline/cfq; newer ones mq-deadline/kyber/bfq/none. Naming a
# single scheduler meant the setting was simply skipped on half of them.
IO_SCHEDULER="mq-deadline deadline none noop"
IO_READ_AHEAD_KB=128
IO_NR_REQUESTS=64
IO_STATS=0
IO_ADD_RANDOM=0

# --- Battery protection ----------------------------------------------
# THE MOST IMPORTANT SETTINGS IN THIS FILE.
#
# Charging current is the largest controllable source of battery heat.
# Resistive heating scales with the square of current, so charging at
# 1000 mA instead of 2000 mA produces roughly a quarter of the heat.
# On a swollen cell this matters more than anything else here.
CHARGE_CURRENT_MA=1000

# Stop charging at 80%. The 80-100% band holds the cell at its highest
# voltage, which is the main driver of swelling and capacity fade.
# If the module cannot find a vendor charge-limit node, HPC falls back
# to pausing charge input, which is checked every service tick and
# always released on uninstall.
CHARGE_LIMIT_ENABLED=1
CHARGE_LIMIT=80

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=30

# --- Thermal thresholds ----------------------------------------------
# Deliberately low. On damaged hardware we want HPC easing off long
# before the kernel's own thermal governor has to intervene, because by
# the time the kernel throttles, the junction is already hot.
TEMP_WARM=42
TEMP_HOT=48
TEMP_CRITICAL=54

# Battery temperature ceiling. Lower than the module default of 43C
# because a swollen cell should never be run warm.
BATTERY_TEMP_LIMIT=38
