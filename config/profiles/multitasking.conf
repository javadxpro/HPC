# Hamedis Performance Core - MULTITASKING profile
# Priority: fast, stutter-free app switching and instant wakeups.
# Holds a higher CPU floor so returning to an app never waits for
# clocks to climb, at a moderate power cost.

PROFILE_NAME="MULTITASKING"
PROFILE_DESC="Fast app switching - higher CPU floor, quick wakeups"
PROFILE_VERSION=1

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="schedutil walt interactive ondemand"
CPU_MAX_PERCENT=100
CPU_MIN_PERCENT=40
CPU_UP_RATE_LIMIT_US=500
CPU_DOWN_RATE_LIMIT_US=8000
CPU_HISPEED_LOAD=75

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="msm-adreno-tz performance simple_ondemand"
GPU_MAX_PERCENT=100
GPU_MIN_PERCENT=20
GPU_IDLE_TIMER=100
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
SCHED_MIN_GRANULARITY_NS=1500000
SCHED_WAKEUP_GRANULARITY_NS=1500000
SCHED_MIGRATION_COST_NS=250000
SCHED_LATENCY_NS=10000000
SCHED_CHILD_RUNS_FIRST=1
SCHED_AUTOGROUP=1

# --- VM / memory -----------------------------------------------------
# Keep app memory resident so switches are instant.
VM_SWAPPINESS=30
VM_VFS_CACHE_PRESSURE=50
VM_DIRTY_RATIO=25
VM_DIRTY_BACKGROUND_RATIO=12
VM_PAGE_CLUSTER=3
VM_STAT_INTERVAL=5

# --- Graphics ---------------------------------------------------------
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=30
TEMP_WARM=46
TEMP_HOT=52
TEMP_CRITICAL=58
