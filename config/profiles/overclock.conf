# Hamedis Performance Core - OVERCLOCK profile
# Priority: everything at the absolute hardware limit.
#
# HONEST SCOPE (read this):
# This profile pins every clock to the highest frequency the STOCK
# kernel exposes. On a stock 4.14 kernel the frequency table is set at
# factory time - there is NO sysfs knob that goes beyond it. "Real"
# overclocking (frequencies above the stock table) requires a custom
# kernel; this module does not and will not do that, because running a
# SoC beyond its validated envelope is how people brick phones.
#
# What this profile DOES (the maximum the stock hardware allows):
#   - CPU floor = CPU ceiling = hardware max on every policy
#     (no downclocking between frames, no governor latency)
#   - GPU governor performance, floor = ceiling = max, clocks forced on
#   - tightest scheduler latency in the module
#   - Vulkan renderer (lowest CPU driver overhead)
#   - polling every 20 s so thermal response stays fast at full load
#
# WHAT STILL PROTECTS THE DEVICE (non-negotiable, unchanged):
#   - the KERNEL's own thermal governor still has final authority and
#     will slam the clocks the moment the silicon is genuinely hot -
#     under sustained load expect the kernel to throttle. That is
#     physics, and it is a safety feature, not a bug.
#   - HPC's own stepwise ease-off (TEMP_WARM/HOT/CRITICAL below) fires
#     BEFORE the kernel has to intervene, exactly like gaming120.
#   - GPU kernel throttling stays forced ON.
#   - Battery-aware policy still applies (see config.conf).
#
# USE IT LIKE A TURBO BUTTON: for benchmarks and short heavy sessions.
# For all-day use it will run hot and drain the battery fast.

PROFILE_NAME="OVERCLOCK"
PROFILE_DESC="Everything at the stock hardware limit (turbo)"
PROFILE_VERSION=1

# --- CPU -------------------------------------------------------------
# performance governor: no latency management, straight to top.
CPU_GOVERNOR_PREF="performance schedutil walt interactive"
# Ceiling: hardware maximum. Floor: also hardware maximum - the clock
# never leaves the top step while this profile is active.
CPU_MAX_PERCENT=100
CPU_MIN_PERCENT=100
CPU_UP_RATE_LIMIT_US=100
CPU_DOWN_RATE_LIMIT_US=100
CPU_HISPEED_LOAD=1

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="performance msm-adreno-tz simple_ondemand"
GPU_MAX_PERCENT=100
GPU_MIN_PERCENT=100
# Keep the GPU fully awake; power-gating at max load is pure overhead.
GPU_IDLE_TIMER=250
# NON-NEGOTIABLE: kernel GPU throttling stays on.
GPU_THROTTLING=1
# force_clk_on: keep the GPU clock domain powered while running.
GPU_FORCE_CLK=1

# --- Scheduler -------------------------------------------------------
# Tightest of every profile: render threads must be picked immediately.
SCHED_MIN_GRANULARITY_NS=400000
SCHED_WAKEUP_GRANULARITY_NS=700000
SCHED_MIGRATION_COST_NS=150000
SCHED_LATENCY_NS=3000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=0

# --- VM / memory -----------------------------------------------------
# Keep game assets resident in RAM; OOM mid-benchmark is unacceptable.
VM_SWAPPINESS=10
VM_VFS_CACHE_PRESSURE=60
VM_DIRTY_RATIO=40
VM_DIRTY_BACKGROUND_RATIO=25
VM_DIRTY_EXPIRE_CENTISECS=1500
VM_DIRTY_WRITEBACK_CENTISECS=750
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=5

# --- Graphics --------------------------------------------------------
# Vulkan: the cheapest driver path on this hardware.
GFX_RENDERER=vulkan

# --- Module behaviour ------------------------------------------------
# Fast polling so the thermal ladder reacts quickly at full load.
POLL_INTERVAL=20

# --- Thermal thresholds ----------------------------------------------
# Same ladder as gaming120: stay out of the way while "warm" is normal
# for full-throttle silicon, back off hard before the kernel has to
# slam it. The kernel still governs above this.
TEMP_WARM=68
TEMP_HOT=76
TEMP_CRITICAL=82
