# Hamedis Performance Core - PERFORMANCE profile
# Priority: sustained frame pacing and input responsiveness.
#
# READ THIS BEFORE EDITING:
# This profile does NOT pin frequencies to maximum and does NOT disable
# thermal protection. Pinning max frequency on a Snapdragon 860 causes
# the kernel thermal governor to throttle *harder* a few minutes in,
# producing worse sustained FPS and visible frame drops. What actually
# helps sustained performance is:
#   - raising the FLOOR so clocks do not collapse between frames
#   - reducing scheduler latency so input/render threads are picked fast
#   - keeping the GPU awake slightly longer between frames
# The ceiling stays at 100% so the hardware can boost when it needs to,
# and the kernel remains fully in charge of throttling.

PROFILE_NAME="PERFORMANCE"
PROFILE_DESC="Sustained gaming responsiveness within thermal limits"

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="schedutil walt interactive performance ondemand"
# Ceiling stays at hardware max - we do NOT clamp it down, and we do NOT
# force it. The governor decides.
CPU_MAX_PERCENT=100
# The important knob: hold a modest floor so clocks do not drop to the
# lowest step between frames, which is what causes micro-stutter.
CPU_MIN_PERCENT=25
# React quickly to load spikes, fall back a little more slowly.
CPU_UP_RATE_LIMIT_US=500
CPU_DOWN_RATE_LIMIT_US=5000
CPU_HISPEED_LOAD=80

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="msm-adreno-tz performance simple_ondemand"
GPU_MAX_PERCENT=100
# Hold a GPU floor for the same reason as the CPU floor.
GPU_MIN_PERCENT=30
# Longer idle timer keeps the GPU from power-gating between frames.
GPU_IDLE_TIMER=140
# Kernel GPU throttling STAYS ENABLED. Non-negotiable.
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
# Lower granularity = render/input threads get scheduled sooner.
SCHED_MIN_GRANULARITY_NS=750000
SCHED_WAKEUP_GRANULARITY_NS=1000000
SCHED_MIGRATION_COST_NS=250000
SCHED_LATENCY_NS=6000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=0

# --- VM / memory -----------------------------------------------------
# Lower swappiness during gameplay: avoid swapping out game textures,
# but NOT zero - zRAM is still far cheaper than an OOM kill mid-match.
VM_SWAPPINESS=60
VM_VFS_CACHE_PRESSURE=80
VM_DIRTY_RATIO=30
VM_DIRTY_BACKGROUND_RATIO=15
VM_DIRTY_EXPIRE_CENTISECS=1500
VM_DIRTY_WRITEBACK_CENTISECS=750
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=10

# --- Graphics ---------------------------------------------------------
# Vulkan cuts CPU-side draw-call submission cost, which is the single
# largest slice of "graphics work the CPU still has to do". This is the
# real version of "move graphics load off the CPU".
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
# Poll a bit more often while gaming so thermal response is timely,
# but still nowhere near a tight loop.
POLL_INTERVAL=30
TEMP_WARM=50
TEMP_HOT=58
TEMP_CRITICAL=64
