# Hamedis Performance Core - SILENT profile
# Priority: quiet and cool for light everyday use (media, browsing,
# calls). Moderate clocks, fast GPU power-down, longer service polls.

PROFILE_NAME="SILENT"
PROFILE_DESC="Cool, quiet everyday use - light clocks, fast GPU sleep"
PROFILE_VERSION=1

# --- CPU -------------------------------------------------------------
CPU_GOVERNOR_PREF="schedutil powersave ondemand conservative"
CPU_MAX_PERCENT=75
CPU_MIN_PERCENT=0
CPU_UP_RATE_LIMIT_US=15000
CPU_DOWN_RATE_LIMIT_US=10000
CPU_HISPEED_LOAD=90

# --- GPU -------------------------------------------------------------
GPU_GOVERNOR_PREF="powersave simple_ondemand msm-adreno-tz"
GPU_MAX_PERCENT=70
GPU_MIN_PERCENT=0
GPU_IDLE_TIMER=50
GPU_THROTTLING=1
GPU_FORCE_CLK=0

# --- Scheduler -------------------------------------------------------
SCHED_MIN_GRANULARITY_NS=2500000
SCHED_WAKEUP_GRANULARITY_NS=3000000
SCHED_MIGRATION_COST_NS=500000
SCHED_LATENCY_NS=20000000
SCHED_CHILD_RUNS_FIRST=0
SCHED_AUTOGROUP=1

# --- VM / memory -----------------------------------------------------
VM_SWAPPINESS=100
VM_VFS_CACHE_PRESSURE=100
VM_DIRTY_RATIO=20
VM_DIRTY_BACKGROUND_RATIO=10
VM_PAGE_CLUSTER=0
VM_STAT_INTERVAL=10

# --- Graphics ---------------------------------------------------------
GFX_RENDERER=auto

# --- Module behaviour ------------------------------------------------
POLL_INTERVAL=60
TEMP_WARM=43
TEMP_HOT=49
TEMP_CRITICAL=55
