# busybox httpd configuration for the HPC WebUI
#
# The MIME mapping below is not optional. busybox httpd has no built-in
# type for .webmanifest and serves it with NO Content-Type header at all.
# Chrome silently refuses a manifest that is not served as JSON, so the
# app would never become installable - with no error shown anywhere.

# --- MIME types -------------------------------------------------------
.webmanifest:application/manifest+json
.json:application/json
.svg:image/svg+xml
.js:application/javascript
.css:text/css
.html:text/html

# --- CGI --------------------------------------------------------------
# Run .sh files under cgi-bin through the shell.
*.sh:/system/bin/sh

# --- Access control ---------------------------------------------------
# Loopback only. The interface can change CPU limits and charging
# behaviour, so it must never be reachable from the network. httpd is
# already bound to 127.0.0.1; this is defence in depth.
A:127.0.0.1
D:*
