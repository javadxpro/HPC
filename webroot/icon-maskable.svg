<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant.
       Android may crop this to a circle, squircle, rounded square or
       teardrop depending on the launcher. Only the centre 40% radius is
       guaranteed visible, so every meaningful element is pulled inward
       and the background bleeds to all four edges. -->
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a26"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="mcore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="mheat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00d68f"/>
      <stop offset="0.55" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
  </defs>

  <!-- full bleed background, no rounding: the launcher supplies the mask -->
  <rect width="512" height="512" fill="url(#mbg)"/>

  <!-- everything below sits inside the safe circle (r = 205 from centre) -->
  <rect x="186" y="186" width="140" height="140" rx="18" fill="url(#mcore)"/>

  <!-- short pin stubs, kept well inside the crop boundary -->
  <g fill="#2c3644">
    <rect x="212" y="162" width="14" height="24" rx="5"/>
    <rect x="249" y="162" width="14" height="24" rx="5"/>
    <rect x="286" y="162" width="14" height="24" rx="5"/>
    <rect x="212" y="326" width="14" height="24" rx="5"/>
    <rect x="249" y="326" width="14" height="24" rx="5"/>
    <rect x="286" y="326" width="14" height="24" rx="5"/>
    <rect x="162" y="212" width="24" height="14" rx="5"/>
    <rect x="162" y="249" width="24" height="14" rx="5"/>
    <rect x="162" y="286" width="24" height="14" rx="5"/>
    <rect x="326" y="212" width="24" height="14" rx="5"/>
    <rect x="326" y="249" width="24" height="14" rx="5"/>
    <rect x="326" y="286" width="24" height="14" rx="5"/>
  </g>

  <!-- H monogram -->
  <path d="M214 214 h20 v38 h44 v-38 h20 v84 h-20 v-24 h-44 v24 h-20 z"
        fill="#ffffff" opacity="0.95"/>

  <!-- sustained curve -->
  <path d="M202 312 L226 300 L250 290 L274 287 L308 287"
        fill="none" stroke="url(#mheat)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="308" cy="287" r="6" fill="#00d68f"/>
</svg>
